name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/temporal-order-saga]

permissions:
  contents: read

jobs:
  temporal-workflow-tests:
    name: Temporal workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workflows/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r workflows/requirements.txt
      - name: Run workflow tests
        run: python -m pytest -q workflows/tests

  go-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-auth, catalog, search, restaurant-ops, driver-ops, order-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.mod
      - name: Test and compile
        working-directory: services/${{ matrix.service }}
        run: go test ./...

  compose-config:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
